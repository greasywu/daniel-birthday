.orn.tl { left: -2%; top: 0; }
.orn.tr { left: 83%; top: 0; transform: scaleX(-1); }
.orn.br { right: -2%; bottom: 0; transform: rotate(180deg); }
.col .orn { width: 48cqw; }

/* cover screen */
.cover {
  position: fixed;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  background: inherit;
  transition: opacity 0.8s ease, visibility 0s linear 0.8s;
}
.cover.out { opacity: 0; visibility: hidden; }
.cover .orn { width: min(48vw, 190px); }
.mail {
  position: absolute;
  left: 0; right: 0;
  top: 0;
  bottom: 0;
  justify-content: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.1rem;
  animation: rise 0.9s ease-out 0.15s both;
}
@keyframes jitter {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  14% { transform: translate(1.2px, -1.6px) rotate(0.6deg); }
  29% { transform: translate(-1.4px, 0.8px) rotate(-0.5deg); }
  43% { transform: translate(0.8px, 1.4px) rotate(0.4deg); }
  58% { transform: translate(-0.8px, -1.2px) rotate(-0.6deg); }
  73% { transform: translate(1.6px, 0.4px) rotate(0.5deg); }
  87% { transform: translate(-1px, -0.6px) rotate(-0.3deg); }
}
.mail img { width: min(30vw, 9rem); height: auto; animation: jitter 2.6s ease-in-out infinite; }
.mail p { margin: 0; font-size: 1rem; color: var(--pink); }

/* letter page */
.col {
  position: relative;
  overflow: hidden;
  container-type: inline-size;
  max-width: 27rem;
  margin: 0 auto;
}
.collage { position: relative; z-index: 1; aspect-ratio: 390 / 375; }
.collage > * { position: absolute; display: block; }
.collage img { height: auto; filter: drop-shadow(1px 3px 4px rgba(0, 0, 0, 0.5)); }
.title {
  left: 6.2%;
  top: 9.6%;
  margin: 0;
  font-weight: 400;
  font-size: 9.6cqw;
  line-height: 1.3;
  color: var(--pink);
  transform: rotate(-6deg);
  transform-origin: left top;
  white-space: nowrap;
  z-index: 5;
}
.stamp { left: 83.1%; top: 31.9%; width: 19.2%; transform: translate(-50%, -50%) rotate(15.5deg); z-index: 4; }
.env   { left: 70.6%; top: 62.1%; width: 49.6%; transform: translate(-50%, -50%) rotate(-8deg); z-index: 1; }
.lily  { left: 48.3%; top: 61.5%; width: 51%;   transform: translate(-50%, -50%) rotate(16deg); z-index: 2; }
.pol   { left: 20%;   top: 74.1%; width: 21.3%; transform: translate(-50%, -50%) rotate(-8deg); z-index: 3; }

.letter { position: relative; font-size: 3.8cqw; line-height: 1.28; white-space: pre-wrap; overflow-wrap: break-word; }
.ghost { visibility: hidden; }
.typed { position: absolute; inset: 0; }
.cursor {
  display: inline-block;
  width: 2px;
  height: 1.2em;
  margin-left: 2px;
  vertical-align: text-bottom;
  background: var(--pink);
  animation: blink 1s steps(1) infinite;
}
.done .cursor { display: none; }
@keyframes blink { 50% { opacity: 0; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: pre-wrap; }
.kiss {
  position: absolute;
  right: 15%;
  bottom: 9.4cqw;
  width: 15.8cqw;
  height: auto;
  transform: translate(50%, 50%) rotate(-21.9deg);
  opacity: 0;
  transition: opacity 1.6s ease;
  pointer-events: none;
}
.done .kiss { opacity: 1; }

.foot { position: relative; z-index: 1; height: 41.5cqw; }
.foot img { position: absolute; width: 27.6%; height: auto; filter: drop-shadow(1px 3px 4px rgba(0, 0, 0, 0.5)); }
.foot .k1 { left: 36.7%; top: 17.2cqw; transform: translate(-50%, -50%) rotate(-9deg); z-index: 1; }
.foot .k2 { left: 64.9%; top: 19.7cqw; transform: translate(-50%, -50%) rotate(2.3deg); z-index: 2; }

.skip {
  position: fixed;
  right: calc(18px + env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
  background: none;
  border: 0;
  padding: 0.5rem;
  font: inherit;
  font-size: 1rem;
  color: var(--pink-dim);
  cursor: pointer;
}
.skip:hover, .skip:focus-visible { color: var(--pink); }
.skip:focus-visible { outline: 1px solid var(--pink); outline-offset: 2px; }
.done .skip { display: none; }
@media (prefers-reduced-motion: reduce) {
  .mail, .mail img { animation: none; }
  .cover { transition: none; }
  .cursor { animation: none; }
  .kiss { transition: none; }
}
</style>
</head>

(function () {
  var LETTER = "Dear Daniel,\nYou’re 24! I felt inspired to make you something special with digital design tools, and hopefully this gives you a better idea of what it is that I learn at school lol.\n\nMy sister asked me a few months ago, if I could list out 10 reasons I loved you, and back then I could do about 7 because we hadn’t been dating for that long. But now I feel confident that I have 10 reasons and today is a good day for me to boost your ego… don’t get cocky but here is the list :\n\n1. You make me comfortable being myself. I think we’ve talked about this before, but we broke the ice pretty early on. I told you about my cavity and showed you my Johnny Sins drawing and you didn’t run away :)\n2. You make me smile and laugh. I first noticed that we were getting along because my roommates told me they heard how much we were laughing in the kitchen. But even after so many months you still make me laugh everyday.\n3. You’re a good communicator and make me feel heard. I’m not afraid to express my frustrations with you because you listen and make efforts to rectify things when you blunder.. You don’t invalidate my feelings or get defensive, and we work problems out easily.\n4. I feel secure and safe with you. You never miss my calls/texts and have never done anything to break my full trust in you. I’ve never felt anxious in this relationship and I hope I can make you feel equally secure as well :)\n5. You’re affectionate! I love the physical touch and words of affirmation you give me. I love your hugs, kisses, cuddles, pinches, bites (not the sternum rubs). One of my top memories ever is you telling me you loved me for the first time. Hearing you whisper “i love you” with your retainer lisp made my brain explode lol :)\n6. You’re hot. No further explanation needed.\n7. You’re thoughtful - maybe not as thoughtful as this birthday letter but you’re halfway there. You always take me on fun dates, buy me snacks, and take my interests into account when planning things to do together. I appreciate it when you ask me to do things you know I love like cooking, painting, and outdoor stuff.\n8. You have a very cute personality. I love the way you joke around and banter. Your smile is so contagious and I can’t help but smile too when I see you happy. I also think you have cool interests and I love that you love animals. Thank you for introducing me to anime and kickstarting my weeb pipeline.\n9. You let me into your life. I appreciate you letting me meet your friends and family. They’re all really lovely people of course.\n10. You’re my best friend. I can always hold a fun conversation with you. You care about my opinion, my interests, and the mundane parts about my life. I’m excited everyday to see you/call you to tell you about my day.\n\nIf you have a rough day, I hope this can cheer you up!! Happy birthday my love.\n\nGrace W";

  var typed = document.getElementById("typed");
  var cursor = document.querySelector(".cursor");
  document.getElementById("ghost").textContent = LETTER;
  document.getElementById("sr").textContent = LETTER;
  var i = 0, timer = null, finished = false, follow = true;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function delayFor(c) {
    if (c === "." || c === "!" || c === "?") return 400;
    if (c === "\n") return 260;
    if (c === "," || c === ";" || c === ":") return 180;
    return 34 + Math.random() * 16; // relaxed reading pace
  }
  window.addEventListener("wheel", function () { follow = false; }, { passive: true });
  window.addEventListener("touchmove", function () { follow = false; }, { passive: true });
  function keepInView() {
    var r = cursor.getBoundingClientRect();
    var limit = window.innerHeight - 110;
    if (r.bottom >= 0 && r.top <= window.innerHeight) follow = true;
    if (follow && r.bottom > limit) window.scrollBy(0, r.bottom - limit);
  }
  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    typed.textContent = LETTER;
    document.body.classList.add("done");
  }
  function step() {
    if (i >= LETTER.length) { finish(); return; }
    var c = LETTER.charAt(i++);
    typed.textContent = LETTER.slice(0, i);
    keepInView();
    timer = setTimeout(step, delayFor(c));
  }
  document.getElementById("skip").addEventListener("click", finish);

  // cover screen shows for 3 seconds, then fades out and the letter starts typing
  var cover = document.getElementById("cover");
  setTimeout(function () {
    cover.classList.add("out");
    document.documentElement.classList.remove("locked");
    window.scrollTo(0, 0);
    setTimeout(function () { if (cover.parentNode) cover.parentNode.removeChild(cover); }, 900);
    if (reduced) finish(); else timer = setTimeout(step, 900);
  }, 3000);
})();
</script>
</body>
</html>
